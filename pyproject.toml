[project]
name = "MotionChallenge-omnixtreme"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["MotionChallenge-Core", "torch==2.14.1"]

[tool.uv.sources]
motionchallenge-core = {path = "MotionChallenge-Core", editable = true}
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

