[project]
name = "motion-challenge-omnixtreme"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["motion-challenge", "torch==2.14.1"]

[tool.uv.sources]
motion-challenge = {path = "motion-challenge", editable = true}
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

